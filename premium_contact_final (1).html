<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Contact</title><script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#4facfe,#6a11cb);padding:20px}.container{width:420px;background:rgba(255,255,255,.15);backdrop-filter:blur(15px);border-radius:20px;padding:30px;box-shadow:0 20px 40px rgba(0,0,0,.3);color:#fff}h2,p{text-align:center}p{margin:0 0 20px}input,textarea{width:100%;padding:14px;margin:10px 0;border:none;border-radius:12px;background:rgba(255,255,255,.2);color:#fff}input::placeholder,textarea::placeholder{color:#eee}button{width:100%;padding:14px;border:none;border-radius:12px;background:#00b4ff;color:#fff;font-weight:600}.g-recaptcha{margin:15px 0}
</style>
</head>
<body>

<div class="container">
<h2>📩 Contact Us</h2><p style="text-align:center">We would love to hear from you!</p>

<form action="https://formspree.io/f/mkjwwpve" method="POST" onsubmit="if(grecaptcha.getResponse()===''){alert('Complete reCAPTCHA');return false;}return true;">

<input type="text" name="name" placeholder="Your Name" required>

<input type="email" name="email" placeholder="Your Email" required>

<input type="tel" name="phone" placeholder="Your Phone Number">

<textarea name="message" placeholder="Your Message"></textarea>

<div class="g-recaptcha" data-sitekey="6Ld-GnotAAAAAJkHxczROb6R5SYRviDcihNIt28x"></div><button type="submit">Send Message</button>

</form>

</div>

</body>
</html>
